# Syncs this repo with the GNU Nano upstream repository.
# Uses a bare git mirror clone + push --mirror to keep all branches and tags in sync.

name: SyncNano-Alt

on:
  #schedule:
  #- cron: '*/5 * * * *'
  #  timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: sync-nano-mirror
  cancel-in-progress: false   # never cancel a run mid-push

jobs:
  mirror:
    name: Mirror GNU Nano upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # Required to push to this repository

    steps:
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache bare mirror clone
        uses: actions/cache@v6
        with:
          path: repo.git
          key: nano-mirror-alt-${{ github.run_id }}
          restore-keys: |
            nano-mirror-alt-

      - name: Clone or update mirror from GNU Savannah
        run: |
          if [ -d repo.git ]; then
            echo "Using cached mirror, running incremental update..."
            cd repo.git
            git remote update --prune
          else
            echo "No cache found, doing full mirror clone..."
            git clone --mirror https://github.com/ahjragaas/nano.git repo.git
          fi

      - name: Push branches and tags to GitHub
        env:
          GH_REMOTE: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        run: |
          cd repo.git

          # Push all branches (prune any that no longer exist upstream, but GitHub
          # will reject deletion of the default branch — that's fine, we ignore it).
          git push "$GH_REMOTE" \
            '+refs/heads/*:refs/heads/*' \
            --prune \
            || true

          # Push all tags (always force-update).
          git push "$GH_REMOTE" \
            '+refs/tags/*:refs/tags/*' \
            --prune

      - name: Verify push succeeded (at least one ref updated)
        env:
          GH_REMOTE: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        run: |
          cd repo.git
          # List remote refs to confirm connectivity and that master is present.
          git ls-remote "$GH_REMOTE" refs/heads/master

